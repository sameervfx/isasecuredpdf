<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ISA Secured PDF</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <!-- Header -->
    <div class="header">
      <div class="logo-group">
        <div class="logo-icon">🛡️</div>
        <div>
          <h1 class="title">ISA Secured PDF</h1>
          <p class="subtitle">100% Client-Side Privacy</p>
        </div>
      </div>
      <span class="badge">OFFLINE</span>
    </div>

    <!-- Main CTA -->
    <button id="btnLaunchEditor" class="btn btn-primary">
      <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
      </svg>
      Open PDF Workspace
    </button>

    <!-- Dropzone -->
    <div id="dropzone" class="dropzone">
      <input type="file" id="fileInput" accept="application/pdf" style="display:none;" />
      <svg class="drop-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
      </svg>
      <p class="drop-text"><strong>Click or Drop PDF here</strong></p>
      <p class="drop-subtext">Opens directly into secure local editor</p>
    </div>

    <!-- Quick Features -->
    <div class="features-grid">
      <div class="feature-item">
        <span class="feat-icon">🔒</span>
        <span>Redact Info</span>
      </div>
      <div class="feature-item">
        <span class="feat-icon">✍️</span>
        <span>Sign & Certify</span>
      </div>
      <div class="feature-item">
        <span class="feat-icon">📋</span>
        <span>Universal Paste</span>
      </div>
      <div class="feature-item">
        <span class="feat-icon">⚡</span>
        <span>Zero Uploads</span>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span>Right-click any PDF link to open</span>
      <a href="https://isasecuredpdf.com" target="_blank" class="footer-link">isasecuredpdf.com</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
