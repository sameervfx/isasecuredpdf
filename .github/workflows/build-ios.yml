name: Build Universal iOS App (Cloud)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: Build Universal iOS App (All iPhones & iPads)
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath ios/App/DerivedData/ISASecuredPDF.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package Universal iOS App Artifact
        run: |
          mkdir -p build-output
          cd ios/App/DerivedData/ISASecuredPDF.xcarchive/Products/Applications
          zip -r ../../../../../build-output/ISASecuredPDF_Universal_iOS.zip App.app

      - name: Upload Universal iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISASecuredPDF_Universal_iOS
          path: build-output/ISASecuredPDF_Universal_iOS.zip
          retention-days: 14
