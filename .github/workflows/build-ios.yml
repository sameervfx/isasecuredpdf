name: Build iOS App (Cloud)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: Build iOS App Archive
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/App/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_PROVISIONING_PROFILE=""

      - name: Package iOS Build Artifact
        run: |
          mkdir -p build-output
          cd ios/App/DerivedData/Build/Products/Release-iphoneos
          zip -r ../../../../../../build-output/ISASecuredPDF_iOS_Release.zip App.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISASecuredPDF_iOS_Release
          path: build-output/ISASecuredPDF_iOS_Release.zip
          retention-days: 14
