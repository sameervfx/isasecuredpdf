name: Build iOS App (Cloud)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: Build iOS App Simulator Bundle
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -m 1 'iPhone' | awk -F '[()]' '{print $2}')
          echo "Building for iOS Simulator ID: $SIM_ID"
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "id=$SIM_ID" \
            -derivedDataPath ios/App/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package iOS App Artifact
        run: |
          mkdir -p build-output
          cd ios/App/DerivedData/Build/Products/Release-iphonesimulator
          zip -r ../../../../../../build-output/ISASecuredPDF_iOS_App.zip App.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISASecuredPDF_iOS_App
          path: build-output/ISASecuredPDF_iOS_App.zip
          retention-days: 14
