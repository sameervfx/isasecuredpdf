name: Package iOS App (Cloud)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  package-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: Package iOS Project & Native Assets
        run: |
          mkdir -p build-output
          zip -r build-output/ISASecuredPDF_iOS_Package.zip ios/App public dist capacitor.config.json

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISASecuredPDF_iOS_Package
          path: build-output/ISASecuredPDF_iOS_Package.zip
          retention-days: 14
