      - name: Build & Export Signed App Store IPA
        run: |
          export LC_ALL=en_US.UTF-8
          export LANG=en_US.UTF-8

          cat << 'EOF' > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>6298P795S6</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.isasecuredpdf.app</key>
                  <string>ISASecuredPDF AppStore Profile</string>
              </dict>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          EOF

          cd ios/App && pod install && cd ../..

          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/App.xcarchive" \
            CODE_SIGNING_ALLOWED="NO"

          xcodebuild -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/App.xcarchive" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath "$GITHUB_WORKSPACE/output"

      - name: Upload IPA Artifact for Transporter
        uses: actions/upload-artifact@v4
        with:
          name: ISASecuredPDF_AppStore_Build
          path: output/*.ipa
