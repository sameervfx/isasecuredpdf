name: Upload iOS App to App Store Connect

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  upload-appstore:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: Setup App Store Connect Auth Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cat << 'EOF' > ~/.appstoreconnect/private_keys/AuthKey_VNY293MKDY.p8
          -----BEGIN PRIVATE KEY-----
          MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQgJP2wpHmHCTCxp0jk
          GLjnJerADJ8GG0iFSiEfW+wuJVKgCgYIKoZIzj0DAQehRANCAARHWksnziRfYynp
          zfClH1UDracQV2vzD0b7Py3yBu0jyxdj5rkHMDRIRGlRp4TdA/jEzU5g5qd/sLh1
          cvvp5T+R
          -----END PRIVATE KEY-----
          EOF

      - name: Build iOS Archive & Export IPA
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/App.xcarchive" \
            DEVELOPMENT_TEAM="6298P795S6" \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p "$GITHUB_WORKSPACE/Payload"
          cp -r "$GITHUB_WORKSPACE/App.xcarchive/Products/Applications/App.app" "$GITHUB_WORKSPACE/Payload/"
          cd "$GITHUB_WORKSPACE"
          zip -r "$GITHUB_WORKSPACE/ISASecuredPDF.ipa" Payload

      - name: Upload IPA to App Store Connect
        run: |
          xcrun altool --upload-app \
            -f "$GITHUB_WORKSPACE/ISASecuredPDF.ipa" \
            -t ios \
            --apiKey VNY293MKDY \
            --apiIssuer 64b0aa54-c75b-42fc-a4a8-b4268bc6c53c
