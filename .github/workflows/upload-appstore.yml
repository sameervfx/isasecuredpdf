name: Upload iOS App to App Store Connect

on:
  push:
    branches: [ ios-cloud-upload ]
  workflow_dispatch:

jobs:
  upload-appstore:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios

