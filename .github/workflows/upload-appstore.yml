          node -e "
          const fs = require('fs');
          const path = require('path');
          const os = require('os');
          const b64 = fs.readFileSync('profile.b64', 'utf8').replace(/\s+/g, '');
          const dir = path.join(os.homedir(), 'Library', 'MobileDevice', 'Provisioning Profiles');
          fs.mkdirSync(dir, { recursive: true });
          fs.writeFileSync(path.join(dir, 'ISASecuredPDF_AppStore_Profile.mobileprovision'), Buffer.from(b64, 'base64'));
          fs.writeFileSync(path.join(dir, 'df148f46-fd2e-47d0-8bc0-e6fa500d3dd0.mobileprovision'), Buffer.from(b64, 'base64'));
