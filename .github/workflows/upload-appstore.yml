name: Upload iOS App to App Store Connect

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  upload-appstore:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: Import Apple Distribution Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ""
          p12-password: "123456"

      - name: Install App Store Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/ISASecuredPDF_AppStore_Profile.mobileprovision

      - name: Setup App Store Connect Auth Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cat << 'EOF' > ~/.appstoreconnect/private_keys/AuthKey_VNY293MKDY.p8
          -----BEGIN PRIVATE KEY-----
          MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQgJP2wpHmHCTCxp0jk
          GLjnJerADJ8GG0iFSiEfW+wuJVKgCgYIKoZIzj0DAQehRANCAARHWksnziRfYynp
          zfClH1UDracQV2vzD0b7Py3yBu0jyxdj5rkHMDRIRGlRp4TdA/jEzU5g5qd/sLh1
          cvvp5T+R
          -----END PRIVATE KEY-----
          EOF

      - name: Build & Export App Store Signed IPA
        run: |
          cat << 'EOF' > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>6298P795S6</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/App.xcarchive" \
            DEVELOPMENT_TEAM="6298P795S6"

          xcodebuild -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/App.xcarchive" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath "$GITHUB_WORKSPACE/output"

      - name: Upload IPA to App Store Connect
        run: |
          IPA_FILE=$(find $GITHUB_WORKSPACE/output -name "*.ipa" | head -n 1)
          echo "Uploading IPA: $IPA_FILE"
          xcrun altool --upload-app \
            -f "$IPA_FILE" \
            -t ios \
            --apiKey VNY293MKDY \
            --apiIssuer 64b0aa54-c75b-42fc-a4a8-b4268bc6c53c
