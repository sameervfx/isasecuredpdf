name: Build & Export Android APK

on:
  push:
    branches: [ ios-cloud-upload, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Install dependencies
        run: npm install

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Patch Capacitor Android Gradle Version Mismatches
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          function walk(dir) {
            let results = [];
            if (!fs.existsSync(dir)) return results;
            const list = fs.readdirSync(dir);
            list.forEach(file => {
              file = path.join(dir, file);
              const stat = fs.statSync(file);
              if (stat && stat.isDirectory()) {
                results = results.concat(walk(file));
              } else if (file.endsWith('.gradle')) {
                results.push(file);
              }
            });
            return results;
          }

          const gradleFiles = walk('android').concat(walk('node_modules/@capacitor'));
          gradleFiles.forEach(p => {
            let c = fs.readFileSync(p, 'utf8');
            let updated = c.replace(/8\.13\.0/g, '8.4.0')
                           .replace(/8\.2\.2/g, '8.4.0')
                           .replace(/10\.1\.1/g, '14.0.1')
                           .replace(/10\.1\.2/g, '14.0.1');
            if (updated !== c) {
              fs.writeFileSync(p, updated);
              console.log('Patched:', p);
            }
          });

          const appGradle = 'android/app/build.gradle';
          if (fs.existsSync(appGradle)) {
            let c = fs.readFileSync(appGradle, 'utf8');
            let runNum = process.env.GITHUB_RUN_NUMBER || '2';
            let updated = c.replace(/versionCode\s+\d+/g, 'versionCode ' + runNum)
                           .replace(/versionName\s+["'].*?["']/g, 'versionName "1.3.0"');
            fs.writeFileSync(appGradle, updated);
            console.log('Bumped versionCode to:', runNum);
          }
          "

      - name: Build Android APK & Play Store AAB
        run: |
          cd android
          chmod +x gradlew
          sed -i 's/\r$//' gradlew
          export TERM=dumb
          set -o pipefail
          ./gradlew assembleDebug bundleRelease --stacktrace --console=plain 2>&1 | tee build-debug.log || {
            echo "::error::Gradle build failed! Duplicate class and error summary below:"
            grep -i -E "duplicate|found in|error|failed|exception" build-debug.log | head -n 35 | while IFS= read -r line || [ -n "$line" ]; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/build-debug.log

      - name: Upload Android APK Artifact (For Testing)
        uses: actions/upload-artifact@v4
        with:
          name: ISASecuredPDF_Android_App
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Android AAB Artifact (For Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: ISASecuredPDF_Android_PlayStore_AAB
          path: android/app/build/outputs/bundle/**/*.aab
          retention-days: 14

