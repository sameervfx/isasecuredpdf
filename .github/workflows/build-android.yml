name: Build & Export Android APK

on:
  push:
    branches: [ ios-cloud-upload, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Patch Capacitor Android Plugin AGP Version
        run: |
          node -e "
          const fs = require('fs');
          const files = [
            'android/build.gradle',
            'android/capacitor-cordova-android-plugins/build.gradle'
          ];
          files.forEach(p => {
            if (fs.existsSync(p)) {
              let c = fs.readFileSync(p, 'utf8');
              c = c.replace(/8\.13\.0/g, '8.2.2').replace(/VERSION_21/g, 'VERSION_17');
              fs.writeFileSync(p, c);
            }
          });
          const v = 'android/variables.gradle';
          if (fs.existsSync(v)) {
            let c = fs.readFileSync(v, 'utf8');
            c = c.replace(/compileSdkVersion = 36/g, 'compileSdkVersion = 34').replace(/targetSdkVersion = 36/g, 'targetSdkVersion = 34');
            fs.writeFileSync(v, c);
          }
          console.log('Successfully patched Capacitor Android build files');
          "

      - name: Build Android APK (Debug / Test)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISASecuredPDF_Android_App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
